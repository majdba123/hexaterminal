name: Renew TLS Certificates

# Manual-dispatch maintenance for the origin's Let's Encrypt certificates.
#
# Why this exists: the certbot renewal on the origin stopped running at some
# point before October 2026 and nobody noticed, so `hexaterminal.com` has served
# an expired certificate since 7 October and `api.hexaterminal.com` since
# 28 October. The deploy's own health checks fall back to http://127.0.0.1:3000,
# which answered fine, so three deploys went green over a dead public
# certificate.
#
# What the first dry run (2026-11-08) found:
#   - hexaterminal.com renews with the *standalone* authenticator, which wants
#     to bind port 80. nginx already owns port 80, so every renewal since has
#     failed with "Could not bind TCP port 80".
#   - api.hexaterminal.com fails differently: "Connection reset by peer".
#   - This host also carries certificates for malik/msz/studio/voice
#     .hexaterminal.com, which belong to other sites. We touch only our own.
#
# `repair` is the real fix: reissuing with --nginx writes authenticator = nginx
# into the renewal config, so the scheduled renewal works from then on. It keeps
# the existing --cert-name lineage, so the paths nginx already points at
# (/etc/letsencrypt/live/<name>/) do not move.
#
# This workflow is the sanctioned way in: it reuses the deploy's SSH secrets, so
# nobody has to hand-edit the server or pass a private key around, and every run
# is logged. It never runs on push -- TLS work is an explicit operator decision.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose reports only. *-dry-run tests against the staging ACME server. renew uses the current config; repair switches to the nginx authenticator and reissues.'
        required: true
        default: 'diagnose'
        type: choice
        options:
          - diagnose
          - dry-run
          - renew
          - repair-dry-run
          - repair

permissions:
  contents: read

# Never let two runs overlap, and never cancel one midway: an interrupted
# certbot run can leave a half-written renewal lineage behind.
concurrency:
  group: hexaterminal-tls-renewal
  cancel-in-progress: false

jobs:
  renew:
    name: TLS ${{ inputs.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Run certbot on the origin
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 30s
          command_timeout: 15m
          envs: RENEW_MODE
          script: |
            set -Eeuo pipefail

            # Only our own certificates. The box is shared: malik, msz, studio
            # and voice .hexaterminal.com belong to other sites, and a bare
            # `certbot renew` would have swept all of them into our run.
            CERT_APEX="hexaterminal.com"
            CERT_API="api.hexaterminal.com"
            DOMAINS_APEX="-d hexaterminal.com -d www.hexaterminal.com"
            DOMAINS_API="-d api.hexaterminal.com"

            echo "::group::certbot availability"
            if ! command -v certbot >/dev/null 2>&1; then
              echo "::error::certbot is not on PATH on this host."
              exit 1
            fi
            certbot --version
            echo "--- installed plugins ---"
            # repair needs the nginx plugin; if it is missing, say so here
            # rather than failing halfway through a reissue.
            certbot plugins --non-interactive 2>&1 || true
            echo "::endgroup::"

            echo "::group::Renewal configuration (the actual fault)"
            for conf in /etc/letsencrypt/renewal/*.conf; do
              [ -e "$conf" ] || continue
              echo "--- $conf"
              # No secrets here: plugin names and paths only.
              grep -E '^(authenticator|installer|webroot_path|server)[[:space:]]*=' "$conf" \
                | sed 's/^/    /' || echo "    (no authenticator recorded)"
            done
            echo "::endgroup::"

            echo "::group::Certificates before"
            certbot certificates || true
            echo "::endgroup::"

            echo "::group::Why renewal stopped - timer state"
            systemctl is-enabled certbot.timer 2>&1 || true
            systemctl is-active certbot.timer 2>&1 || true
            systemctl list-timers 'certbot*' --all --no-pager 2>/dev/null || true
            echo "::endgroup::"

            echo "::group::Certificate paths nginx serves"
            grep -rhoE 'ssl_certificate(_key)?[[:space:]]+[^;]+;' /etc/nginx 2>/dev/null \
              | sort -u || echo "  could not read /etc/nginx"
            echo "::endgroup::"

            if [ "$RENEW_MODE" = "diagnose" ]; then
              echo "Diagnose only; nothing was changed."
              exit 0
            fi

            # --- the operation itself -------------------------------------
            rc=0
            case "$RENEW_MODE" in
              dry-run|renew)
                extra=""
                [ "$RENEW_MODE" = "dry-run" ] && extra="--dry-run"
                for name in "$CERT_APEX" "$CERT_API"; do
                  echo "::group::certbot renew --cert-name $name $extra"
                  certbot renew --cert-name "$name" --non-interactive $extra || rc=$?
                  echo "::endgroup::"
                done
                ;;
              repair-dry-run|repair)
                extra=""
                [ "$RENEW_MODE" = "repair-dry-run" ] && extra="--dry-run"
                # --cert-name keeps the existing lineage, so the live/ paths
                # nginx already references do not move. --nginx is what gets
                # persisted into the renewal config and fixes auto-renewal.
                echo "::group::certbot certonly --nginx --cert-name $CERT_APEX $extra"
                certbot certonly --nginx --cert-name "$CERT_APEX" $DOMAINS_APEX \
                  --non-interactive --agree-tos --keep-until-expiring $extra || rc=$?
                echo "::endgroup::"
                echo "::group::certbot certonly --nginx --cert-name $CERT_API $extra"
                certbot certonly --nginx --cert-name "$CERT_API" $DOMAINS_API \
                  --non-interactive --agree-tos --keep-until-expiring $extra || rc=$?
                echo "::endgroup::"
                ;;
              *)
                echo "::error::unknown mode '$RENEW_MODE'."
                exit 1
                ;;
            esac

            echo "::group::Certificates after (certbot exit $rc)"
            certbot certificates || true
            echo "::endgroup::"

            if [ "$rc" -ne 0 ]; then
              echo "::error::certbot failed with exit code $rc. nginx was left untouched."
              exit "$rc"
            fi

            case "$RENEW_MODE" in
              dry-run|repair-dry-run)
                echo "Simulation succeeded. Re-run without -dry-run to issue."
                exit 0
                ;;
            esac

            echo "::group::Reload nginx"
            nginx -t
            systemctl reload nginx
            systemctl is-active --quiet nginx
            echo "nginx reloaded."
            echo "::endgroup::"

            echo "::group::Re-arm automatic renewal"
            # The point of the whole exercise: do not let this lapse again.
            # A failure here must not fail the run -- the certificates are
            # already issued and serving by now.
            if systemctl list-unit-files 'certbot.timer' --no-legend 2>/dev/null | grep -q certbot; then
              systemctl enable --now certbot.timer \
                && systemctl list-timers 'certbot*' --all --no-pager \
                || echo "::warning::could not enable certbot.timer; renewal is still manual."
            else
              echo "::warning::no certbot.timer on this host; renewal is still manual."
            fi
            echo "::endgroup::"
        env:
          RENEW_MODE: ${{ inputs.mode }}

      - name: Verify public TLS from outside the server
        if: inputs.mode == 'renew' || inputs.mode == 'repair'
        shell: bash
        env:
          TLS_MIN_DAYS_REMAINING: "14"
        run: |
          set -Eeuo pipefail

          # Deliberately the same check as the deploy's final gate, for the same
          # reason: the server can reach itself on loopback while the public
          # hostname serves something else. Only a probe from off the box proves
          # a visitor gets a valid certificate -- that is exactly the blind spot
          # that hid this for a month.
          failures=0

          check_host() {
            local host="$1" probe_url="$2"

            # Peer verification IS the check. Never weaken this curl.
            if ! curl --fail --silent --show-error --location \
                 --retry 3 --retry-delay 5 --retry-connrefused \
                 --max-time 20 --output /dev/null "$probe_url"; then
              echo "::error::$host is not reachable over valid HTTPS ($probe_url)." >&2
              failures=$((failures + 1))
              return
            fi

            local not_after epoch now days
            not_after="$(echo \
              | openssl s_client -servername "$host" -connect "$host:443" 2>/dev/null \
              | openssl x509 -noout -enddate 2>/dev/null \
              | cut -d= -f2 || true)"

            if [ -z "$not_after" ]; then
              echo "::warning::$host answered over HTTPS but its certificate expiry could not be read." >&2
              return
            fi

            epoch="$(date -d "$not_after" +%s 2>/dev/null || true)"
            if [ -z "$epoch" ]; then
              echo "::warning::$host returned an unparseable certificate expiry ('$not_after')." >&2
              return
            fi
            now="$(date +%s)"
            days=$(( (epoch - now) / 86400 ))

            if [ "$days" -lt 0 ]; then
              echo "::error::$host certificate expired $(( -days )) day(s) ago ($not_after)." >&2
              failures=$((failures + 1))
            elif [ "$days" -lt "$TLS_MIN_DAYS_REMAINING" ]; then
              echo "::warning::$host certificate expires in $days day(s) ($not_after)." >&2
            else
              echo "$host: HTTPS ok, certificate valid for $days more day(s)."
            fi
          }

          check_host "www.hexaterminal.com" "https://www.hexaterminal.com/api/health"
          check_host "hexaterminal.com"     "https://hexaterminal.com/api/health"
          check_host "api.hexaterminal.com" "https://api.hexaterminal.com/api/health/ready"

          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures host(s) still fail public TLS verification." >&2
            exit 1
          fi

          echo "All three hostnames serve a valid certificate."
