name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend and frontend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -e

            cd /var/www/hexaterminal
            git config --global --add safe.directory /var/www/hexaterminal
            git fetch origin main
            git reset --hard origin/main

            export COMPOSER_ALLOW_SUPERUSER=1
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan optimize:clear
            php artisan optimize

            cd /var/www/hexaterminal/frontend
            git config --global --add safe.directory /var/www/hexaterminal/frontend
            npm install
            npm run build

            systemctl restart hexa-frontend
            systemctl reload nginx
