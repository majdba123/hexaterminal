name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      allow_fresh_seed:
        description: 'Destructively reset and reseed the production database. Never use with real CMS data.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: hexaterminal-production-deploy
  cancel-in-progress: true

jobs:
  validate:
    name: Validate HexaTerminal Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        env:
          COMPOSER_ALLOW_SUPERUSER: 1
        shell: bash
        run: |
          set -Eeuo pipefail

          for attempt in 1 2 3; do
            if composer install --prefer-install=dist --no-interaction --no-progress; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "composer install failed on attempt $attempt, retrying after backoff..." >&2
            sleep $((attempt * 15))
          done

      - name: Prepare validation environment
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p storage/framework/{cache,sessions,views} bootstrap/cache .ci
          touch .ci/validate.sqlite
          cat > .env <<EOF
          APP_NAME="Hexa Terminal"
          APP_ENV=testing
          APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_DEBUG=false
          APP_URL=http://127.0.0.1:8000
          PUBLIC_MEDIA_URL=http://127.0.0.1:8000
          LOG_CHANNEL=stack
          LOG_DEPRECATIONS_CHANNEL=null
          LOG_LEVEL=warning
          DB_CONNECTION=sqlite
          DB_DATABASE=$GITHUB_WORKSPACE/.ci/validate.sqlite
          BROADCAST_DRIVER=log
          CACHE_DRIVER=array
          CACHE_STORE=array
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=array
          SESSION_LIFETIME=120
          MEMCACHED_HOST=127.0.0.1
          REDIS_HOST=127.0.0.1
          REDIS_PASSWORD=null
          REDIS_PORT=6379
          MAIL_MAILER=array
          MAIL_HOST=127.0.0.1
          MAIL_PORT=2525
          MAIL_USERNAME=null
          MAIL_PASSWORD=null
          MAIL_ENCRYPTION=null
          MAIL_FROM_ADDRESS="hello@example.com"
          MAIL_FROM_NAME="Hexa Terminal"
          ADMIN_NAME="CI Administrator"
          ADMIN_EMAIL=ci-admin@example.com
          ADMIN_PASSWORD=ci-admin-password-1234
          TURNSTILE_SECRET_KEY=
          AI_SEO_PROVIDER=anthropic
          ANTHROPIC_API_KEY=
          AI_SEO_MODEL=claude-opus-4-8
          AI_SEO_TIMEOUT=30
          LEGACY_PUBLIC_WEB_ENABLED=true
          LEGACY_ADMIN_ENABLED=true
          LEGACY_API_ENABLED=true
          CSP_ENABLED=true
          CSP_ENFORCE=false
          HSTS_ENABLED=false
          HSTS_INCLUDE_SUBDOMAINS=false
          HSTS_PRELOAD=false
          SESSION_SECURE_COOKIE=false
          VITE_APP_NAME="Hexa Terminal"
          PHP_CLI_SERVER_WORKERS=8
          EOF

      - name: Install Laravel asset dependencies
        run: npm install --include=optional

      - name: Build Laravel assets
        run: npx vite build

      - name: Run database setup
        shell: bash
        run: |
          set -Eeuo pipefail

          # Exercise migrations, idempotent seeders, and legacy migration once,
          # then reset to a schema-only test database so API tests own all fixtures.
          php artisan migrate --force
          php artisan db:seed --force
          php artisan hexa:migrate-legacy-content
          php artisan migrate:fresh --force

      - name: Run Laravel validation suite
        shell: bash
        run: |
          set -Eeuo pipefail

          php artisan test \
            tests/Feature/HealthTest.php \
            tests/Feature/Api/V1 \
            tests/Feature/Security/CorsPolicyTest.php \
            tests/Feature/Security/ErrorLeakageTest.php \
            tests/Feature/Security/FilamentAuthorizationTest.php \
            tests/Feature/Security/FilamentMfaTest.php \
            tests/Feature/Security/RateLimitingTest.php \
            tests/Feature/Security/ReplayAndAbuseTest.php \
            tests/Feature/Security/ReviewModerationTest.php \
            tests/Feature/Security/SecurityHeadersTest.php \
            tests/Feature/Security/SlugValidationTest.php \
            tests/Feature/Security/StorageRouteTest.php \
            tests/Feature/Security/UploadAllowlistTest.php \
            tests/Feature/Deployment/ProductionMediaSmokeGuardTest.php \
            tests/Feature/Deployment/ProductionRevalidationDeployGuardTest.php \
            tests/Feature/Deployment/ProductionFreshSeedSafetyTest.php \
            tests/Feature/VetoraCaseStudyFeaturedSeedTest.php \
            tests/Feature/Pricing \
            tests/Feature/RevalidationTest.php

      - name: Install frontend dependencies
        run: npm install --include=optional
        working-directory: frontend

      - name: Start Laravel validation server
        shell: bash
        run: |
          set -Eeuo pipefail

          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/validate-server.log 2>&1 &
          echo $! > .ci/validate-server.pid

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo "Laravel validation server failed to start" >&2
          cat storage/logs/validate-server.log >&2 || true
          exit 1

      - name: Run frontend typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Run frontend lint
        run: npm run lint -- .
        working-directory: frontend

      - name: Run frontend build
        env:
          API_URL: http://127.0.0.1:8000/api/v1/public
          NEXT_PUBLIC_SITE_URL: https://hexaterminal.com
          NEXT_PUBLIC_ALLOW_INDEXING: true
          REVALIDATE_SECRET: ci-validation-secret
        run: npm run build
        working-directory: frontend

  deploy:
    name: Deploy HexaTerminal Production
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Package validated release
        shell: bash
        run: |
          set -Eeuo pipefail
          RELEASE_STAGE="$RUNNER_TEMP/hexaterminal-release"
          rm -rf "$RELEASE_STAGE"
          mkdir -p "$RELEASE_STAGE"

          git archive HEAD | tar -x -C "$RELEASE_STAGE"
          git ls-files > "$RELEASE_STAGE/.deploy-manifest"
          printf '%s\n' "${{ github.sha }}" > "$RELEASE_STAGE/.deploy-sha"
          tar -C "$RELEASE_STAGE" -czf release.tar.gz .

      - name: Upload validated release
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 30s
          command_timeout: 10m
          source: release.tar.gz
          target: /tmp/hexaterminal-release-${{ github.sha }}
          overwrite: true

      - name: Deploy backend and frontend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 30s
          command_timeout: 30m
          script: |
            set -Eeuo pipefail

            APP_DIR="/var/www/hexaterminal"
            FRONTEND_DIR="$APP_DIR/frontend"
            DEPLOY_SHA="${{ github.sha }}"
            UPLOAD_DIR="/tmp/hexaterminal-release-$DEPLOY_SHA"
            RELEASE_ARCHIVE="$UPLOAD_DIR/release.tar.gz"
            BACKEND_HEALTH_URL="https://api.hexaterminal.com/api/health/ready"
            MEDIA_SMOKE_URL="https://api.hexaterminal.com/storage/service-offerings/custom-erp-crm-systems.png"
            FRONTEND_HEALTH_URL="https://hexaterminal.com/api/health"
            PUBLIC_PAGE_URL="https://hexaterminal.com/en"

            test -f "$RELEASE_ARCHIVE"
            test -f "$APP_DIR/.env"
            test -f "$FRONTEND_DIR/.env.production"

            RELEASE_DIR="$(mktemp -d /tmp/hexaterminal-extract.XXXXXX)"
            trap 'rm -rf "$RELEASE_DIR" "$UPLOAD_DIR"' EXIT
            tar -xzf "$RELEASE_ARCHIVE" -C "$RELEASE_DIR"
            test "$(cat "$RELEASE_DIR/.deploy-sha")" = "$DEPLOY_SHA"
            test -f "$RELEASE_DIR/artisan"
            test -f "$RELEASE_DIR/frontend/package.json"

            cd "$APP_DIR"

            # Delete only files that belonged to the previous source release.
            # Runtime state and secrets (.env, storage uploads, production
            # frontend env) are explicitly preserved and never come from GitHub.
            if [ -f "$APP_DIR/.deploy-manifest" ]; then
              while IFS= read -r tracked_path; do
                case "$tracked_path" in
                  .env|frontend/.env|frontend/.env.production|storage/*|public/storage|public/storage/*)
                    continue
                    ;;
                esac
                rm -f -- "$APP_DIR/$tracked_path"
              done < "$APP_DIR/.deploy-manifest"
            elif [ -d "$APP_DIR/.git" ]; then
              git -c safe.directory="$APP_DIR" ls-files | while IFS= read -r tracked_path; do
                case "$tracked_path" in
                  .env|frontend/.env|frontend/.env.production|storage/*|public/storage|public/storage/*)
                    continue
                    ;;
                esac
                rm -f -- "$APP_DIR/$tracked_path"
              done
            fi

            tar -C "$RELEASE_DIR" -cf - . | tar -C "$APP_DIR" -xf -
            test "$(cat "$APP_DIR/.deploy-sha")" = "$DEPLOY_SHA"
            test -f "$APP_DIR/.env"
            test -f "$FRONTEND_DIR/.env.production"

            rm -rf "$RELEASE_DIR" "$UPLOAD_DIR"
            trap - EXIT

            export COMPOSER_ALLOW_SUPERUSER=1
            for attempt in 1 2 3; do
              if composer install \
                --no-dev \
                --prefer-install=dist \
                --optimize-autoloader \
                --no-interaction \
                --no-progress; then
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi

              echo "composer install failed on attempt $attempt, retrying after backoff..." >&2
              sleep $((attempt * 15))
            done

            cd "$FRONTEND_DIR"
            test -f package.json
            test -f package-lock.json
            test -f .env.production
            grep -q '^API_URL=https://api\.hexaterminal\.com/api/v1/public$' .env.production
            grep -q '^NEXT_PUBLIC_SITE_URL=https://hexaterminal\.com$' .env.production
            cp .env.production .env

            npm install --include=optional
            rm -rf .next
            if npm run | grep -q " typecheck"; then
              npm run typecheck
            fi
            if npm run | grep -q " lint"; then
              npm run lint -- .
            fi
            npm run build

            cd "$APP_DIR"
            # A push deploy can never reset CMS data. Fresh seeding is an
            # explicit manual-dispatch recovery operation only.
            ALLOW_FRESH_SEED="${{ github.event_name == 'workflow_dispatch' && inputs.allow_fresh_seed || 'false' }}"
            if [ "$ALLOW_FRESH_SEED" = "true" ]; then
              php artisan migrate:fresh --seed --force
            else
              php artisan migrate --force
            fi

            # Recreate the public-storage symlink idempotently before any media
            # synchronization or smoke checks. CMS team uploads live here too.
            php artisan storage:link || true
            test -L "$APP_DIR/public/storage"
            php artisan hexa:sync-service-images

            # Keep Laravel and Next.js on one server-only secret. If this is
            # the first deploy with revalidation enabled, create one securely.
            php deploy/production/sync-revalidation-config.php \
              "$APP_DIR/.env" \
              "$FRONTEND_DIR/.env.production" \
              "$FRONTEND_DIR/.env"
            php artisan optimize:clear
            php artisan optimize
            php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $kernel = $app->make(Illuminate\Contracts\Console\Kernel::class); $kernel->bootstrap(); $expected = "https://api.hexaterminal.com/storage"; $actual = config("filesystems.disks.public.url"); if ($actual !== $expected) { fwrite(STDERR, "Invalid public media URL: {$actual}\n"); exit(1); }'
            php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $kernel = $app->make(Illuminate\Contracts\Console\Kernel::class); $kernel->bootstrap(); $frontend = Dotenv\Dotenv::parse(file_get_contents($argv[1])); $secret = (string) config("revalidation.secret"); $errors = []; if (! config("revalidation.enabled")) { $errors[] = "backend disabled"; } if (config("revalidation.url") !== "https://hexaterminal.com/api/revalidate") { $errors[] = "backend URL is incorrect"; } if ($secret === "") { $errors[] = "backend secret is missing"; } if (! isset($frontend["REVALIDATE_SECRET"]) || (string) $frontend["REVALIDATE_SECRET"] === "") { $errors[] = "frontend secret is missing"; } elseif ($secret !== "" && ! hash_equals($secret, (string) $frontend["REVALIDATE_SECRET"])) { $errors[] = "backend and frontend secrets differ"; } if ($errors !== []) { fwrite(STDERR, "Invalid production revalidation configuration: ".implode(", ", $errors).".\n"); exit(1); }' "$FRONTEND_DIR/.env.production"
            php artisan queue:restart

            # The source release is installed by the SSH deployment user while
            # HTTP requests execute under PHP-FPM. Keep Laravel's writable
            # runtime paths owned by the actual FPM worker user, then reload FPM
            # so OPcache and long-lived workers cannot serve stale release code.
            PHP_FPM_USER="$(ps -eo user=,comm= | awk '$2 ~ /^php-fpm/ && $1 != "root" {print $1; exit}')"
            PHP_FPM_SERVICE="$(systemctl list-units --type=service --state=active --no-legend 'php*-fpm.service' 2>/dev/null | awk 'NR == 1 {print $1}')"

            if [ -n "$PHP_FPM_USER" ]; then
              PHP_FPM_GROUP="$(id -gn "$PHP_FPM_USER")"
              chown -R "$PHP_FPM_USER:$PHP_FPM_GROUP" "$APP_DIR/storage" "$APP_DIR/bootstrap/cache"
              find "$APP_DIR/storage" "$APP_DIR/bootstrap/cache" -type d -exec chmod 775 {} +
              find "$APP_DIR/storage" "$APP_DIR/bootstrap/cache" -type f -exec chmod 664 {} +
              echo "Laravel runtime paths prepared for PHP-FPM user: $PHP_FPM_USER"
            else
              echo "Warning: no PHP-FPM worker user detected; runtime ownership was not changed." >&2
            fi

            if [ -n "$PHP_FPM_SERVICE" ]; then
              systemctl reload "$PHP_FPM_SERVICE" || systemctl restart "$PHP_FPM_SERVICE"
              systemctl is-active --quiet "$PHP_FPM_SERVICE"
              echo "Reloaded PHP-FPM service: $PHP_FPM_SERVICE"
            else
              echo "Warning: no active php*-fpm systemd service detected; continuing with diagnostics enabled." >&2
            fi

            # Verify the same filesystem/config access that the HTTP worker has,
            # without ever printing .env values or credentials into Actions logs.
            if [ -n "$PHP_FPM_USER" ]; then
              runuser -u "$PHP_FPM_USER" -- test -r "$APP_DIR/.env" || {
                echo "PHP-FPM user cannot read Laravel .env" >&2
                exit 1
              }
              runuser -u "$PHP_FPM_USER" -- test -w "$APP_DIR/storage/logs" || {
                echo "PHP-FPM user cannot write storage/logs" >&2
                exit 1
              }
              runuser -u "$PHP_FPM_USER" -- test -w "$APP_DIR/bootstrap/cache" || {
                echo "PHP-FPM user cannot write bootstrap/cache" >&2
                exit 1
              }
            fi

            systemctl restart hexa-frontend
            systemctl is-active --quiet hexa-frontend
            nginx -t
            systemctl reload nginx

            # Capture the safe health payload/status so a future failure tells us
            # whether the web runtime itself is broken or a readiness dependency
            # is unavailable. The endpoint exposes only boolean check results.
            HEALTH_BODY="$(mktemp /tmp/hexa-health.XXXXXX)"
            HEALTH_STATUS="$(curl \
              --silent \
              --show-error \
              --output "$HEALTH_BODY" \
              --write-out '%{http_code}' \
              --max-time 15 \
              "$BACKEND_HEALTH_URL" || true)"

            if [ "$HEALTH_STATUS" != "200" ]; then
              echo "Backend readiness failed with HTTP $HEALTH_STATUS" >&2
              head -c 2000 "$HEALTH_BODY" >&2 || true
              echo >&2
              echo "PHP-FPM service: ${PHP_FPM_SERVICE:-not-detected}" >&2
              echo "PHP-FPM worker user: ${PHP_FPM_USER:-not-detected}" >&2

              php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $kernel = $app->make(Illuminate\Contracts\Console\Kernel::class); $kernel->bootstrap(); try { Illuminate\Support\Facades\DB::select("SELECT 1"); echo "CLI database check: ok\n"; } catch (Throwable $e) { echo "CLI database check: fail (".get_class($e).")\n"; } try { $key = "deploy-health-".bin2hex(random_bytes(4)); Illuminate\Support\Facades\Cache::put($key, "ok", 10); $ok = Illuminate\Support\Facades\Cache::get($key) === "ok"; Illuminate\Support\Facades\Cache::forget($key); echo "CLI cache check: ".($ok ? "ok" : "fail")."\n"; } catch (Throwable $e) { echo "CLI cache check: fail (".get_class($e).")\n"; }'

              if [ -n "$PHP_FPM_USER" ]; then
                runuser -u "$PHP_FPM_USER" -- php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $kernel = $app->make(Illuminate\Contracts\Console\Kernel::class); try { $kernel->bootstrap(); echo "FPM-user Laravel bootstrap: ok\n"; } catch (Throwable $e) { echo "FPM-user Laravel bootstrap: fail (".get_class($e).")\n"; exit(1); }' || true
              fi

              rm -f "$HEALTH_BODY"
              exit 1
            fi

            cat "$HEALTH_BODY"
            rm -f "$HEALTH_BODY"

            # This must be served by the Laravel/Nginx media origin, never by
            # the Next.js frontend. Keep TLS validation enabled: a bad API
            # certificate is a failed production deployment.
            MEDIA_HEADERS="$(curl \
              --fail \
              --silent \
              --show-error \
              --head \
              --retry 5 \
              --retry-delay 3 \
              --retry-connrefused \
              --max-time 15 \
              "$MEDIA_SMOKE_URL")"
            printf '%s\n' "$MEDIA_HEADERS" | grep -qiE '^content-type: image/(png|jpeg|webp|avif|gif)'
            if printf '%s\n' "$MEDIA_HEADERS" | grep -qiE '^content-type: text/html'; then
              echo "Public media returned HTML instead of an image." >&2
              exit 1
            fi
            if printf '%s\n' "$MEDIA_HEADERS" | grep -qiE '^x-powered-by: next\.js'; then
              echo "Public media was routed to Next.js instead of the API origin." >&2
              exit 1
            fi

            curl \
              --fail \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 3 \
              --retry-connrefused \
              --max-time 15 \
              "$FRONTEND_HEALTH_URL"

            curl \
              --fail \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 3 \
              --retry-connrefused \
              --max-time 20 \
              "$PUBLIC_PAGE_URL" \
              > /dev/null
