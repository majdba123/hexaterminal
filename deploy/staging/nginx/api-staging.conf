# =============================================================================
# Nginx — Laravel API + Filament CMS host (api-staging.hexaterminal.com)
# Serves the versioned public API (/api/v1/public/*), the legacy /api/*,
# public media (/storage/*), and the Filament CMS (/cms). PHP via PHP-FPM.
#
# TLS is assumed to be terminated here (certs via your ACME tooling) OR at an
# upstream load balancer that sets X-Forwarded-* (see TRUSTED_PROXIES in the
# Laravel .env). No secrets in this file.
# =============================================================================

server {
    listen 80;
    server_name api-staging.hexaterminal.com;

    # Force HTTPS (drop this block if TLS is terminated upstream).
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api-staging.hexaterminal.com;

    root /var/www/hexa/public;
    index index.php;

    ssl_certificate     /etc/ssl/hexa/api-staging.fullchain.pem;
    ssl_certificate_key /etc/ssl/hexa/api-staging.key.pem;

    client_max_body_size 32M;   # allow CMS media uploads

    # Security headers (frame-ancestors/HSTS live here, at the edge).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # The CMS must not be framed by other sites.
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # Uptime/liveness probe — never rewritten to index.php cache.
    location = /api/health {
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # -------------------------------------------------------------------------
    # Public media (CMS uploads). `public/storage` is a symlink to the
    # writable storage/app/public volume, so EVERY byte under this prefix is
    # attacker-influenced content uploaded through /cms. Two hard rules:
    #
    #  1. It must never reach PHP-FPM. Filament stores uploads under a random
    #     ULID but preserves the client-supplied extension, so an editor can
    #     land a real `.php` file here; without this block the `\.php$`
    #     location below would happily execute it (`try_files $uri =404` is
    #     NOT sufficient -- an uploaded file genuinely exists).
    #  2. It must never render as an active document in this origin. `.svg`
    #     (and `.html`) execute inline script when navigated to directly, and
    #     this origin also hosts /cms -- so that would be stored XSS against
    #     an authenticated CMS session. `sandbox` puts any such document in an
    #     opaque origin, which kills same-origin access while leaving normal
    #     <img> loads working.
    #
    # `^~` takes precedence over the `\.php$` regex location below, so this
    # match wins for anything under /storage/.
    # -------------------------------------------------------------------------
    location ^~ /storage/ {
        # nginx does not inherit add_header into a location that sets its own,
        # so the server-level baseline is repeated here deliberately.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;

        # Defence in depth: even if the prefix precedence above ever changes,
        # an uploaded script is refused rather than interpreted.
        location ~ \.php$ {
            return 404;
        }

        try_files $uri =404;
    }

    location ~ \.php$ {
        # Refuse requests for PHP files that do not exist rather than letting
        # PHP-FPM resolve them via PATH_INFO.
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_pass app:9000;                       # php-fpm service (compose) or 127.0.0.1:9000
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_read_timeout 60s;
    }

    # Deny dotfiles and VCS metadata.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
