# =============================================================================
# Nginx — public frontend host (staging.hexaterminal.com)
# Routes all public traffic to the Next.js server (node, `next start` on :3000).
#
# This file ALSO encodes the future single-domain CUTOVER routing contract
# (documented in docs/migration/frontend-cutover-plan.md): if/when the public
# site and the API/CMS share one origin, the `/api` and `/cms` location blocks
# below hand those paths to Laravel while everything else goes to Next.js. On a
# separate-domain staging setup they are harmless (nothing calls them here) and
# serve as the tested template for cutover.
# =============================================================================

upstream nextjs_upstream {
    server frontend:3000;   # compose service, or 127.0.0.1:3000 for a bare host
    keepalive 16;
}

# If co-locating the API on this origin at cutover, point this at Laravel.
upstream laravel_upstream {
    server app_web:443;     # the api-staging nginx/php-fpm server
}

server {
    listen 80;
    server_name staging.hexaterminal.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name staging.hexaterminal.com;

    ssl_certificate     /etc/ssl/hexa/staging.fullchain.pem;
    ssl_certificate_key /etc/ssl/hexa/staging.key.pem;

    client_max_body_size 8M;

    # Edge security headers. Note: the app also sets X-Robots-Tag=noindex on
    # staging (NEXT_PUBLIC_ALLOW_INDEXING=false); this is belt-and-braces.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;   # REMOVE at production cutover

    # ---- Cutover routing (dormant on separate-domain staging) ---------------
    # location /cms  { proxy_pass https://laravel_upstream; include proxy_params; }
    # location /api  { proxy_pass https://laravel_upstream; include proxy_params; }
    # location /storage { proxy_pass https://laravel_upstream; include proxy_params; }
    # -------------------------------------------------------------------------

    # Next.js build assets — long-cache immutable.
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
